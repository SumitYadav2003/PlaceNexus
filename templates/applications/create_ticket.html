{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="fw-bold text-center mb-4">

                        🎫 Create Support Ticket

                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Subject

                            </label>

                            {{ form.subject }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Category

                            </label>

                            {{ form.category }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Priority

                            </label>

                            {{ form.priority }}

                        </div>

                        <div class="mb-4">

    <label class="form-label fw-bold">

        Describe Your Issue

    </label>

    {{ form.message }}

    <small class="text-muted">

        Explain your problem so the placement coordinator can help you faster.

    </small>

</div>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'student_dashboard' %}"
                               class="btn btn-outline-secondary rounded-pill">

                                ← Dashboard

                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary rounded-pill">

                                Create Ticket

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
