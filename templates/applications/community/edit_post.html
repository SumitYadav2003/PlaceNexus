{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <!-- Header -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        <i class="fas fa-edit text-primary me-2"></i>

                        Edit Community Post

                    </h2>

                    <p class="text-muted mb-0">

                        Update your community post and keep everyone informed.

                    </p>

                </div>

                <a
                    href="{% url 'community_post_detail' post.id %}"
                    class="btn btn-outline-secondary rounded-pill">

                    <i class="fas fa-arrow-left me-2"></i>

                    Back

                </a>

            </div>

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body p-5">

                    <form
                        method="POST"
                        enctype="multipart/form-data">

                        {% csrf_token %}

                        <!-- Title -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="fas fa-heading text-primary me-2"></i>

                                Title

                            </label>

                            <input
                                type="text"
                                name="title"
                                value="{{ post.title }}"
                                class="form-control rounded-3"
                                required>

                        </div>

                        <!-- Post Type -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="fas fa-tag text-primary me-2"></i>

                                Post Type

                            </label>

                            <select
                                name="post_type"
                                class="form-select rounded-3">

                                {% for value,label in post.POST_TYPE_CHOICES %}

                                    <option
                                        value="{{ value }}"
                                        {% if post.post_type == value %}selected{% endif %}>

                                        {{ label }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- Content -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="fas fa-align-left text-primary me-2"></i>

                                Content

                            </label>

                            <textarea
                                name="content"
                                rows="7"
                                class="form-control rounded-3"
                                required>{{ post.content }}</textarea>

                        </div>

                        <!-- Current Image -->

                        {% if post.image %}

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="fas fa-image text-primary me-2"></i>

                                Current Image

                            </label>

                            <img
                                src="{{ post.image.url }}"
                                class="img-fluid rounded-4 shadow">

                        </div>

                        {% endif %}

                        <!-- Replace Image -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="fas fa-upload text-primary me-2"></i>

                                Replace Image

                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control">

                        </div>

                        <!-- Coordinator Only -->

                        {% if profile.role == "coordinator" %}

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="is_pinned"
                                name="is_pinned"
                                {% if post.is_pinned %}checked{% endif %}>

                            <label
                                class="form-check-label fw-semibold"
                                for="is_pinned">

                                📌 Pin this post to the top of the Community Feed

                            </label>

                        </div>

                        {% endif %}

                        <!-- Buttons -->

                        <div class="d-flex gap-3">

                            <button
                                type="submit"
                                class="btn btn-primary rounded-pill px-4">

                                <i class="fas fa-save me-2"></i>

                                Save Changes

                            </button>

                            <a
                                href="{% url 'community_post_detail' post.id %}"
                                class="btn btn-outline-secondary rounded-pill px-4">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
