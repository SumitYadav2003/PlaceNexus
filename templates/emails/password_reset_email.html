<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<style>

body{

font-family:Arial,sans-serif;

background:#f4f6f9;

padding:30px;

}

.container{

max-width:650px;

margin:auto;

background:white;

border-radius:12px;

overflow:hidden;

box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.header{

background:#0d6efd;

padding:25px;

text-align:center;

color:white;

}

.content{

padding:35px;

}

.button{

display:inline-block;

padding:14px 28px;

background:#0d6efd;

color:white!important;

text-decoration:none;

border-radius:8px;

font-weight:bold;

}

.footer{

background:#f8f9fa;

padding:20px;

text-align:center;

font-size:13px;

color:#777;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>PlaceNexus</h1>

<p>Password Reset Request</p>

</div>

<div class="content">

<h2>Hello,</h2>

<p>

A request was made to reset your PlaceNexus password.

</p>

<p>

Click the button below.

</p>

<p style="text-align:center;">

<a

class="button"

href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">

Reset Password

</a>

</p>

<p>

If you didn't request this, you can safely ignore this email.

</p>

<p>

Regards,

<br>

<strong>PlaceNexus Team</strong>

</p>

</div>

<div class="footer">

© 2026 PlaceNexus

</div>

</div>

</body>

</html>
