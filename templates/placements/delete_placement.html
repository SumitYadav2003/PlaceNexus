{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5 text-center">

                    <i class="fas fa-box-archive fa-4x text-warning mb-4"></i>

                    <h2 class="fw-bold mb-3">

                        Archive Placement

                    </h2>

                    <p class="text-muted mb-4">

                        Are you sure you want to archive

                        <strong>

                            {{ placement.company }} - {{ placement.role }}

                        </strong>?

                    </p>

                    <p class="text-muted">

                        Archived placements will no longer be visible to students,
                        but can be restored later.

                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-warning me-2">

                            <i class="fas fa-box-archive me-2"></i>

                            Archive

                        </button>

                        <a href="{% url 'placement_list' %}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
