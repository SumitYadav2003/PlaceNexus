{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="card shadow border-0 rounded-4 mx-auto" style="max-width:600px;">

        <div class="card-body p-5 text-center">

            <h3 class="text-danger mb-4">

                Permanently Delete Placement?

            </h3>

            <p class="mb-4">

                This will permanently delete

                <strong>

                    {{ placement.company }}

                </strong>

                -

                <strong>

                    {{ placement.role }}

                </strong>

                from the database.

            </p>

            <p class="text-danger">

                <strong>

                    This action cannot be undone.

                </strong>

            </p>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger">

                    Permanently Delete

                </button>

                <a
                    href="{% url 'placement_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
